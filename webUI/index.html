<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Workflow Studio · ComfyUI</title>
    <meta name="description" content="从 ComfyUI API 工作流自动生成参数页面并运行本地任务">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23b8f448'/%3E%3Cpath d='M9 10h6v6H9zm8 6h6v6h-6zM9 22h6v-6' fill='none' stroke='%230d1208' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Workflow Studio 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>
          <strong>Workflow Studio</strong>
          <small>COMFYUI WORKFLOW CONSOLE</small>
        </span>
      </a>
      <div class="server-state" id="serverState">
        <span class="state-dot"></span>
        <span id="serverStateText">正在检测服务</span>
      </div>
    </header>

    <main class="studio-layout">
      <aside class="workflow-sidebar">
        <div class="sidebar-heading">
          <div>
            <p class="eyebrow">WORKFLOWS</p>
            <h1>工作流</h1>
          </div>
          <span class="count-badge" id="workflowCount">0</span>
        </div>
        <label class="search-field">
          <span class="visually-hidden">搜索工作流</span>
          <input id="workflowSearch" type="search" placeholder="搜索工作流…" autocomplete="off">
        </label>
        <nav class="workflow-list" id="workflowList" aria-label="工作流列表">
          <p class="list-empty">正在读取工作流…</p>
        </nav>
        <div class="sidebar-note">
          <span>自动发现</span>
          <p>API 工作流会自动生成参数面板，无需单独编写页面。</p>
        </div>
      </aside>

      <section class="parameter-panel">
        <header class="panel-toolbar">
          <div class="workflow-title">
            <p class="eyebrow">PARAMETERS</p>
            <h2 id="workflowName">选择一个工作流</h2>
            <p id="workflowMeta">从左侧列表开始</p>
          </div>
          <div class="toolbar-actions">
            <label class="advanced-toggle">
              <input id="showAdvanced" type="checkbox">
              <span>全部参数</span>
            </label>
            <button class="reset-button" id="resetButton" type="button">重置</button>
          </div>
        </header>

        <form id="parameterForm" class="parameter-form">
          <div class="empty-parameters" id="emptyParameters">请选择工作流</div>
          <div class="parameter-groups" id="parameterGroups" hidden></div>
          <div class="form-actions">
            <button class="run-button" id="runButton" type="submit" disabled>
              <span class="run-symbol" aria-hidden="true"></span>
              <span id="runButtonText">运行工作流</span>
            </button>
            <button class="cancel-button" id="cancelButton" type="button" hidden>取消任务</button>
          </div>
        </form>
      </section>

      <section class="result-panel">
        <header class="result-toolbar">
          <div>
            <p class="eyebrow">OUTPUT</p>
            <h2>执行结果</h2>
          </div>
          <div class="job-id" id="jobId" hidden>
            <span>任务 ID</span>
            <code id="jobIdValue"></code>
          </div>
        </header>

        <div class="result-stage" id="resultStage">
          <div class="empty-state" id="emptyState">
            <div class="empty-visual" aria-hidden="true"><span></span></div>
            <h3>等待运行</h3>
            <p>选择工作流、调整参数并开始运行，图片、视频、音频和文本结果都会显示在这里。</p>
          </div>

          <div class="progress-state" id="progressState" hidden>
            <div class="orbital-loader" aria-hidden="true"><span></span><span></span><span></span></div>
            <p class="progress-label" id="progressLabel">PREPARING</p>
            <h3 id="progressTitle">正在准备工作流</h3>
            <p id="progressDetail">处理输入参数</p>
            <div class="progress-meta">
              <span id="elapsedTime">00:00</span>
              <span class="meta-divider"></span>
              <span id="queueState">准备中</span>
            </div>
          </div>

          <div class="error-state" id="errorState" hidden>
            <div class="error-icon">!</div>
            <h3>工作流执行失败</h3>
            <p id="errorMessage"></p>
            <button type="button" id="retryButton">重新运行</button>
          </div>

          <div class="output-grid" id="outputGrid" hidden></div>
        </div>

        <footer class="result-footer">
          <span><i></i> 本地 ComfyUI</span>
          <span id="resultSummary">等待运行</span>
        </footer>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
